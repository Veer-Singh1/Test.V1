   One HTML file, HTML5 Canvas + vanilla JS. No images, fonts or libraries:

   File layout
     1.  CONFIG ............ ALL balance numbers: player, waves, zombies,

     2.  Utilities
     3.  Save data (localStorage, wrapped in try/catch)
     4.  Audio (tiny 8-bit synth)
     5.  Palette, pixel fonts and text drawing
     6.  Sprites (pixel art → offscreen canvases)

     8.  Input (keyboard, mouse, touch joystick)
     9.  Game state

     12. Rendering — HUD & UI widgets

// 2. UTILITIES
// =========================================================================
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
const choice = arr => arr[(Math.random() * arr.length) | 0];
const dist2 = (ax, ay, bx, by) => (ax - bx) * (ax - bx) + (ay - by) * (ay - by);
const pointInRect = (px, py, r) => px >= r.x && py >= r.y && px < r.x + r.w && py < r.y + r.h;

/** Does the segment (x1,y1)-(x2,y2) touch the circle (cx,cy,r)? Used so fast bullets never tunnel. */
function segCircle(x1, y1, x2, y2, cx, cy, r) {
  const dx = x2 - x1, dy = y2 - y1;
  const len2 = dx * dx + dy * dy;
  let t = len2 > 0 ? ((cx - x1) * dx + (cy - y1) * dy) / len2 : 0;
  t = clamp(t, 0, 1);
  return dist2(x1 + dx * t, y1 + dy * t, cx, cy) <= r * r;
}

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, w); c.height = Math.max(1, h);
  c.getContext('2d').imageSmoothingEnabled = false;
  return c;
}

/** Small seeded RNG so the ground pattern is stable between resizes. */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// 3. SAVE DATA — coins, unlocked guns and upgrades persist between runs
// =========================================================================
const SAVE_KEY = 'rot-and-reload/save/v1';
const save = { coins: 0, owned: { pistol: true }, upgrades: {}, equipped: 'pistol', bestWave: 0, muted: false };
let saveDirty = false, saveTimer = 0;

function sanitizeSave() {
  const max = CONFIG.upgrades.maxLevel;
  for (const g of CONFIG.guns) {
    const u = save.upgrades[g.id] || {};
    save.upgrades[g.id] = {
      damage: clamp(u.damage | 0, 0, max),
      fireRate: clamp(u.fireRate | 0, 0, max),
      magazine: clamp(u.magazine | 0, 0, max),
    };
  }
  save.owned.pistol = true;
  if (!save.owned[save.equipped]) save.equipped = 'pistol';
}

function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      if (d && typeof d === 'object') {
        if (Number.isFinite(d.coins)) save.coins = Math.max(0, Math.floor(d.coins));
        if (d.owned && typeof d.owned === 'object') {
          for (const g of CONFIG.guns) if (d.owned[g.id]) save.owned[g.id] = true;
        }
        if (d.upgrades && typeof d.upgrades === 'object') save.upgrades = d.upgrades;
        if (typeof d.equipped === 'string') save.equipped = d.equipped;
        if (Number.isFinite(d.bestWave)) save.bestWave = Math.max(0, Math.floor(d.bestWave));
        save.muted = !!d.muted;
      }
    }
  } catch (e) { /* storage blocked or corrupt: just start fresh */ }
  sanitizeSave();
}

function writeSave() {
  saveDirty = false;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* private mode etc. */ }
}


// =========================================================================
// 4. AUDIO — a tiny 8-bit synth (square/saw waves + filtered noise)
// =========================================================================
const Sound = {
  ctx: null, master: null, noiseBuf: null, muted: false, last: Object.create(null),

  /** Must be called from a user gesture (browsers block audio until then). */
  init() {
    if (this.ctx) {
      if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
      return;
    }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : CONFIG.audio.volume;
      this.master.connect(this.ctx.destination);
      const len = this.ctx.sampleRate;               // 1 second of white noise, reused by every effect
      this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    } catch (e) { this.ctx = null; }
  },

  setMuted(m) {
    this.muted = m;
    if (this.master) this.master.gain.value = m ? 0 : CONFIG.audio.volume;
  },

  /** Oscillator blip sliding from f0 to f1 Hz. */
  tone(f0, f1, dur, type = 'square', vol = 0.15, delay = 0) {
    const c = this.ctx; if (!c || this.muted) return;
    const t = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.05);
  },

  /** Filtered noise burst — gunshots, explosions, footsteps of doom. */
  noise(dur, vol = 0.15, type = 'lowpass', f0 = 2000, f1 = f0, delay = 0) {
    const c = this.ctx; if (!c || this.muted || !this.noiseBuf) return;
    const t = c.currentTime + delay;
    const src = c.createBufferSource(); src.buffer = this.noiseBuf;
    const filt = c.createBiquadFilter(); filt.type = type;
    filt.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) filt.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    src.connect(filt); filt.connect(g); g.connect(this.master);
    src.start(t, Math.random() * 0.4); src.stop(t + dur + 0.05);
  },

  play(name) {
    if (!this.ctx || this.muted) return;
    const now = this.ctx.currentTime, gap = SFX_GAP[name] || 0.012;
    if (this.last[name] !== undefined && now - this.last[name] < gap) return;  // throttle spammy sounds
    this.last[name] = now;
    const fn = SFX[name];
    if (fn) { try { fn(this); } catch (e) { /* never let audio crash the game */ } }
  },
};

// Rendered strings are cached as tiny canvases, then blitted at integer scale.
const textCache = new Map();
function textCanvas(str, fontName, color) {
  const key = fontName + '|' + color + '|' + str;
  let c = textCache.get(key);
  if (c) return c;
  if (textCache.size > 1200) textCache.clear();
  const f = FONTS[fontName];
  c = makeCanvas(str.length * f.adv - 1, f.h);
  const g = c.getContext('2d');
  g.fillStyle = color;
  for (let i = 0; i < str.length; i++) {
    const rows = f.glyphs[str[i]] || f.glyphs['?'];
    for (let y = 0; y < f.h; y++) {
      const bits = rows[y];
      for (let x = 0; x < f.w; x++) if (bits & (1 << (f.w - 1 - x))) g.fillRect(i * f.adv + x, y, 1, 1);
    }
  }
  textCache.set(key, c);
  return c;
}

function textWidth(str, font = 'big', scale = 1) {
  str = String(str);
  return str.length ? (str.length * FONTS[font].adv - 1) * scale : 0;
}

/** drawText(str, x, y, { font:'big'|'small', scale, color, align:'left'|'center'|'right', shadow, shadowColor }) */
function drawText(str, x, y, o = {}) {
  str = String(str).toUpperCase();
  if (!str.length) return 0;
  const font = o.font || 'big', scale = o.scale || 1;
  const w = textWidth(str, font, scale);
  let dx = x;
  if (o.align === 'center') dx = x - Math.floor(w / 2);
  else if (o.align === 'right') dx = x - w;
  dx = Math.round(dx); y = Math.round(y);
  if (o.shadow !== false) {
    const sc = textCanvas(str, font, o.shadowColor || '#000000');
    ctx.drawImage(sc, dx + scale, y + scale, sc.width * scale, sc.height * scale);
  }
  const c = textCanvas(str, font, o.color || UI.text);
  ctx.drawImage(c, dx, y, c.width * scale, c.height * scale);
  return w;
}

/** Word-wrap a string to a pixel width. */
function wrapText(str, maxW, font = 'small') {
  const words = String(str).toUpperCase().split(' ');
  const lines = []; let line = '';
  for (const word of words) {
    const test = line ? line + ' ' + word : word;
    if (line && textWidth(test, font) > maxW) { lines.push(line); line = word; } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}


// =========================================================================
// 6. SPRITES — pixel art as strings ('.' = transparent). A 1px dark outline
//    is added automatically, plus a white "hit flash" copy of each sprite.
// =========================================================================
function buildSprite(rows, opts = {}) {
  const outline = opts.outline !== false;
  const h0 = rows.length, w0 = Math.max(...rows.map(r => r.length));
  const pad = outline ? 1 : 0, w = w0 + pad * 2, h = h0 + pad * 2;
  const grid = new Array(w * h).fill(null);
  for (let y = 0; y < h0; y++) for (let x = 0; x < w0; x++) {
    const ch = rows[y][x];
    if (ch && ch !== '.') grid[(y + pad) * w + x + pad] = PAL[ch] || '#ff00ff';
  }
  if (outline) {
    const src = grid.slice();
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      if (src[y * w + x]) continue;
      if ((x > 0 && src[y * w + x - 1]) || (x < w - 1 && src[y * w + x + 1]) ||
          (y > 0 && src[(y - 1) * w + x]) || (y < h - 1 && src[(y + 1) * w + x])) grid[y * w + x] = PAL.K;
    }
  }
  const paint = colorOf => {
    const c = makeCanvas(w, h), g = c.getContext('2d');
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const col = grid[y * w + x];
      if (col) { g.fillStyle = colorOf(col); g.fillRect(x, y, 1, 1); }
    }
    return c;
  };
  const spr = { w, h, img: paint(c => c), flash: paint(() => '#ffffff') };
  if (opts.red) spr.red = paint(c => (c === PAL.K ? '#3a0000' : '#ff5a5a'));
  return spr;
}
const mirrorRows = rows => rows.map(r => r.split('').reverse().join(''));

/** Characters get 3 frames: standing, step (right foot up), mirrored step. Walk cycle = 0,1,0,2. */
const WALK_SEQ = [0, 1, 0, 2];
function charFrames(base, legsA, legsB, opts) {
  const a = base.concat(legsA), b = base.concat(legsB);
  return [buildSprite(a, opts), buildSprite(b, opts), buildSprite(mirrorRows(b), opts)];
}
